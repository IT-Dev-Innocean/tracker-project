services:
  # Production — branch main (Netlify frontend)
  - type: web
    name: innocean-tracker
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn backend_api:app --host 0.0.0.0 --port $PORT
    buildFilter:
      paths:
        - backend/**
        - Procfile
        - requirements.txt
        - runtime.txt
        - render.yaml
        - run-backend.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CALENDAR_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # Staging — branch staging (Vercel frontend)
  - type: web
    name: innocean-tracker-staging
    runtime: python
    plan: free
    branch: staging
    # Jangan auto-alembic: staging share DATABASE_URL production
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn backend_api:app --host 0.0.0.0 --port $PORT
    buildFilter:
      paths:
        - backend/**
        - Procfile
        - requirements.txt
        - runtime.txt
        - render.yaml
        - run-backend.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CALENDAR_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
